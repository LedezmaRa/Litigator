      GS:   "Goldman Sachs — capital markets"
      BRK-B: "Berkshire Hathaway — broad financial proxy"
      HYG:  "iShares High Yield Bond ETF — credit spread / stress gauge"
      KRE:  "SPDR Regional Banking ETF — Main Street credit transmission"

  consumer_health:
